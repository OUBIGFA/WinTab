name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # COMReference requires the .NET Framework MSBuild, so `dotnet build` cannot be used here.
      - name: Build solution
        shell: pwsh
        run: msbuild WinTab.sln /restore /t:Build /p:Configuration=Release /nologo /v:minimal

      - name: Run unit tests
        shell: pwsh
        run: |
          & "WinTab.Tests\bin\Release\net9.0-windows\WinTab.Tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed (exit $LASTEXITCODE)" }

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: WinTab.Desktop/go.mod
          cache-dependency-path: WinTab.Desktop/go.sum
      - name: Check, test and build native desktop UI
        working-directory: WinTab.Desktop
        shell: pwsh
        run: |
          $productionTags = 'mygo_nowebview,mygo_noinspector,mygo_nodownload'
          go vet -tags $productionTags ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags $productionTags ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($architecture in @('amd64', 'arm64')) {
            $env:GOARCH = $architecture
            $env:CGO_ENABLED = '0'
            go build -tags $productionTags -o "../_temp/ci-$architecture/WinTab.UI.exe" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
