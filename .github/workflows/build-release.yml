name: Build And Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use (e.g., v1.0.0)"
        required: true
        type: string
        default: "v1.0.0-test"

env:
  PROJECT_NAME: WinTab
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build solution and run unit tests
        shell: pwsh
        run: |
          msbuild WinTab.sln /restore /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }
          & "WinTab.Tests\bin\Release\net9.0-windows\WinTab.Tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed (exit $LASTEXITCODE)" }

      - name: Publish app
        shell: pwsh
        run: |
          $outputDir = "../publish/net9.0-windows/${{ matrix.arch }}"
          msbuild "${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj" /restore /t:Publish /p:Configuration=Release /p:TargetFramework=net9.0-windows /p:RuntimeIdentifier=win-${{ matrix.arch }} /p:SelfContained=false /p:PublishDir=$outputDir /p:DebugType=none

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.arch }}
          path: publish/net9.0-windows/${{ matrix.arch }}

  build-installer:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: publish-${{ matrix.arch }}
          path: publish/net9.0-windows/${{ matrix.arch }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.RELEASE_TAG }}" `
            /DPublishRoot="..\publish\net9.0-windows" `
            /DOutputDir="..\dist" `
            /DArch="${{ matrix.arch }}" `
            "installers\installer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*.exe

  create-release:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-artifacts

      - name: Prepare release body
        shell: bash
        run: |
          notes="release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-body.md
          else
            {
              echo "### 更新内容"
              echo ""
              echo "⚠️ 本版本未提供中文更新说明：仓库中缺少 \`release-notes/${RELEASE_TAG}.md\`。"
            } > release-body.md
          fi
          echo "----- release-body.md -----"
          cat release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PROJECT_NAME }} ${{ env.RELEASE_TAG }}
          draft: false
          body_path: release-body.md
          files: |
            release-artifacts/*.exe
